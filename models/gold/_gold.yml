version: 2

models:
  - name: daily_revenue
    description: Doanh thu theo ngày
    columns:
      - name: order_date
        description: Ngày đặt đơn
        data_type: 'date'
      - name: total_orders
        description: Số đơn khác nhau trong ngày
        data_type: 'int64'
      - name: revenue
        description: Tổng amount
        data_type: 'float64'
      - name: total_cost
        description: Tổng total_cost
        data_type: 'float64'

  - name: gold_revenue_by_month_category
    description: Một dòng là một cặp tháng đặt đơn và category, kèm doanh thu và lợi nhuận (không tính đơn Cancelled và Returned).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_month, category]
    columns:
      - name: order_month
        description: Ngày đầu tháng của thời điểm đặt đơn
        data_tests:
          - not_null
      - name: category
        description: Category của sản phẩm
        # Category lấy từ dim_products; thiếu join thì null nên để warn.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: total_orders
        description: Số đơn khác nhau trong tháng đó, category đó
      - name: revenue
        description: Tổng amount của fact_order_items
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: profit
        description: Tổng (amount - total_cost) của fact_order_items
